<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier Roman IA</title>
<meta name="description" content="Créez votre roman avec l'IA : pitch, plan, personnages, univers et rédaction chapitre par chapitre.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📖%3C/text%3E%3C/svg%3E">
<style>
:root{
 --bg:#f6f3ed; --panel:#fffdf8; --panel2:#f9f5ee; --text:#23262e; --muted:#6f7480;
 --border:#e5e1d7; --soft:#efeae0; --accent:#1f3a5f; --accent2:#16304d; --gold:#a8854f;
 --inputbg:#fff; --ok:#2f7d4f;
 --shadow:0 1px 2px rgba(28,25,23,.05),0 10px 30px rgba(28,25,23,.06);
 --radius:14px;
}
body.dark{
 --bg:#171a20; --panel:#20242c; --panel2:#252a33; --text:#eceae5; --muted:#9aa1ac;
 --border:#343b46; --soft:#2a303a; --accent:#41729e; --accent2:#4f82b5; --gold:#c9a86a;
 --inputbg:#171a20; --ok:#4c9e6f;
 --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);max-width:1020px;margin:0 auto;padding:24px 24px 60px;min-height:100vh;font-size:15px;line-height:1.55}
.masthead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:26px 0 18px;border-bottom:1px solid var(--border);margin-bottom:22px}
.overline{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
h1{font-family:'Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;font-size:2.15rem;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.sub{color:var(--muted);font-size:.88rem;margin-top:8px;max-width:640px}
.serif{font-family:'Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.topbtns{display:flex;gap:6px;flex-shrink:0}
button{font-family:inherit;font-size:.88rem;border-radius:10px;border:none;cursor:pointer;font-weight:600;padding:9px 16px;
 background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:transform .06s ease,box-shadow .15s ease}
button:hover{box-shadow:0 3px 10px rgba(0,0,0,.18)}
button:active{transform:translateY(1px)}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--border);box-shadow:none}
button.ghost:hover{background:var(--soft)}
button.small{padding:6px 11px;font-size:.8rem;border-radius:8px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:.9rem;border-radius:10px;border:1px solid var(--border);padding:9px 12px;background:var(--inputbg);color:var(--text)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
textarea{width:100%;line-height:1.65}
label{font-size:.8rem;font-weight:600;display:block;margin:12px 0 5px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.85rem}
input[type=password]{flex:1;min-width:220px}
.err{background:rgba(185,28,28,.08);border:1px solid rgba(185,28,28,.35);color:#b91c1c;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:.85rem;display:none}
body.dark .err{color:#fca5a5}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:.72rem;background:var(--soft);color:var(--muted);margin-left:8px;font-weight:600}
.badge.ok{background:var(--ok);color:#fff}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:18px;width:fit-content}
.tab{padding:8px 16px;border-radius:9px;border:none;background:transparent;cursor:pointer;font-size:.84rem;font-weight:600;color:var(--muted);box-shadow:none}
.tab.active{background:var(--panel);box-shadow:var(--shadow);color:var(--text)}
.panel{display:none;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.panel.active{display:block}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1;min-width:200px}
select.wide{width:100%}
.hint{font-size:.78rem;color:var(--muted);margin-top:8px}
.card{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.card h3{font-family:'Palatino Linotype',Palatino,Georgia,serif;font-size:1.08rem;margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.card .sum{color:var(--muted);font-style:italic;font-size:.85rem;margin-bottom:8px}
.wc{font-size:.74rem;color:var(--muted);font-weight:400}
.perso{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.spin{opacity:.55;pointer-events:none;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.statsrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.pbar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;flex:1;min-width:140px}
.pfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s ease}
.hero{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:56px 36px;text-align:center;margin-top:8px;box-shadow:var(--shadow)}
.hero .overline{margin-bottom:12px}
.hero h2{font-family:'Palatino Linotype',Palatino,Georgia,serif;font-size:2.6rem;line-height:1.08;letter-spacing:-.015em;margin-bottom:14px;font-weight:700}
.hero p{color:var(--muted);max-width:580px;margin:0 auto 30px;font-size:1rem}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;max-width:760px;margin:0 auto 32px}
.feat{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px 10px;font-size:.82rem;font-weight:600;color:var(--text)}
.hero .start{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:680px;margin:0 auto}
.hero input{min-width:220px}
.hero .big{font-size:.95rem;padding:11px 26px}
.langbtn{background:transparent;color:var(--muted);border:1px solid var(--border);padding:5px 12px;font-size:.78rem;box-shadow:none}
.langbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sep{border:none;border-top:1px solid var(--border);margin:14px 0}
footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:36px}
h2.paneltitle{font-family:'Palatino Linotype',Palatino,Georgia,serif;font-size:1.45rem;letter-spacing:-.01em;color:var(--text);border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:18px;font-weight:700}
</style>
</head>
<body>
<div class="masthead">
  <div>
    <div class="overline">Atelier d'écriture par IA</div>
    <h1>Atelier Roman IA</h1>
    <p class="sub" id="t-tagline"></p>
  </div>
  <div class="topbtns">
    <button class="langbtn" id="btn-fr">FR</button>
    <button class="langbtn" id="btn-en">EN</button>
    <button class="langbtn" id="btn-theme">🌙</button>
  </div>
</div>

<!-- Écran d'accueil -->
<div class="hero" id="hero" style="display:none">
  <div class="overline" id="t-heroOverline"></div>
  <h2 id="t-heroTitle"></h2>
  <p id="t-heroDesc"></p>
  <div class="feats" id="hero-feats"></div>
  <div class="start">
    <input id="hero-title" placeholder="">
    <select id="hero-genre"></select>
    <button class="big" id="hero-start"></button>
  </div>
  <div style="margin-top:18px"><button class="ghost" id="hero-load"></button>
  <input type="file" id="importFile" accept=".json" style="display:none"></div>
  <p class="hint" id="t-heroHint" style="margin-top:28px"></p>
</div>

<!-- Espace de travail -->
<div id="work" style="display:none">
  <div class="bar">
    <strong id="t-projects"></strong>
    <select id="projSel" style="min-width:170px"></select>
    <button class="ghost small" id="b-new"></button>
    <button class="ghost small" id="b-saveproj"></button>
    <button class="ghost small" id="b-import"></button>
    <button class="ghost small" id="b-delproj"></button>
  </div>
  <div class="bar">
    <strong>🔑 <span id="t-settings"></span></strong>
    <input type="password" id="apikey" placeholder="">
    <select id="model">
      <option value="mistral-large-latest">mistral-large-latest</option>
      <option value="mistral-medium-latest">mistral-medium-latest</option>
      <option value="mistral-small-latest">mistral-small-latest</option>
      <option value="open-mistral-nemo">open-mistral-nemo</option>
    </select>
    <span class="badge" id="keybadge"></span>
  </div>
  <div class="err" id="err"></div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-t="projet" id="t-tab1"></div>
    <div class="tab" data-t="plan" id="t-tab2"></div>
    <div class="tab" data-t="perso" id="t-tab3"></div>
    <div class="tab" data-t="monde" id="t-tab4"></div>
    <div class="tab" data-t="redac" id="t-tab5"></div>
  </div>

  <div class="panel active" id="p-projet">
    <h2 class="paneltitle" id="t-hProjet"></h2>
    <label id="t-lTitle"></label><input id="title" style="width:100%">
    <div class="row">
      <div><label id="t-lGenre"></label><select id="genre" class="wide"></select></div>
      <div><label id="t-lStyle"></label><select id="style" class="wide"></select></div>
      <div><label id="t-lNlang"></label><select id="nlang"></select></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <label style="margin:0" id="t-lPitch"></label>
      <button id="b-pitch"></button>
    </div>
    <textarea id="pitch" rows="5" style="margin-top:6px" class="serif"></textarea>
    <div id="pitchOptions" style="margin-top:12px"></div>
    <p class="hint" id="t-pitchHint" style="display:none;margin-top:10px"></p>
    <div id="autoStatus" class="badge ok" style="display:none;margin-top:10px;font-size:.85rem"></div>
  </div>

  <div class="panel" id="p-plan">
    <h2 class="paneltitle" id="t-hPlan"></h2>
    <div class="row" style="align-items:center">
      <div style="flex:0 0 auto"><label style="margin:0" id="t-lNCh"></label></div>
      <div style="flex:0 0 auto"><select id="nch-sel"></select></div>
      <div style="flex:0 0 90px"><input type="number" id="nch" value="12" min="3" max="100"></div>
      <div style="flex:0 0 auto"><button id="b-plan"></button></div>
    </div>
    <textarea id="plan" rows="16" style="margin-top:10px" class="serif"></textarea>
    <p class="hint" id="t-planHint"></p>
  </div>

  <div class="panel" id="p-perso">
    <h2 class="paneltitle" id="t-hPerso"></h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <button id="b-perso"></button>
      <button class="ghost" id="b-perso-add"></button>
    </div>
    <div id="persos"></div>
  </div>

  <div class="panel" id="p-monde">
    <h2 class="paneltitle" id="t-hMonde"></h2>
    <button id="b-monde"></button>
    <textarea id="world" rows="14" style="margin-top:10px" class="serif"></textarea>
  </div>

  <div class="panel" id="p-redac">
    <h2 class="paneltitle" id="t-hRedac"></h2>
    <div class="statsrow" style="margin-bottom:12px">
      <span id="stats"></span>
      <label style="margin:0" id="t-lGoal"></label>
      <input type="number" id="goal" style="width:100px" min="1000" step="1000">
      <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
      <span id="pct"></span>
    </div>
    <div class="statsrow" style="margin-bottom:14px">
      <button class="small" id="b-autonovel"></button>
      <button class="ghost small" id="b-stop" style="display:none"></button>
      <span class="hint" id="auto-note" style="display:none;font-weight:600;color:var(--gold)"></span>
    </div>
    <div class="statsrow" style="margin-bottom:16px">
      <label style="margin:0" id="t-lChLen"></label>
      <select id="chlen"></select>
      <hr class="sep" style="flex:0 0 100%;margin:8px 0">
      <strong id="t-exports"></strong>
      <button class="ghost small" id="b-export">.txt</button>
      <button class="ghost small" id="b-export-md">.md</button>
      <button class="ghost small" id="b-export-epub">.epub</button>
      <button class="ghost small" id="b-export-docx">.docx</button>
      <button class="ghost small" id="b-print">🖨 PDF</button>
    </div>
    <div class="statsrow" style="margin-bottom:16px">
      <strong id="t-rwLabel"></strong>
      <select id="rwmode" style="max-width:240px"></select>
      <div style="position:relative" id="rw-wrap">
        <button class="ghost small" id="rw-drop-btn"></button>
        <div id="rw-drop" style="display:none;position:absolute;top:110%;left:0;z-index:60;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-width:340px;max-height:300px;overflow:auto;box-shadow:var(--shadow)"></div>
      </div>
      <button class="ghost small" id="rw-sel-all"></button>
      <button class="ghost small" id="rw-sel-none"></button>
      <button class="small" id="b-batch-rw"></button>
      <span class="hint" id="rw-hint" style="flex:0 0 100%;margin:0"></span>
    </div>
    <div id="chaps"></div>
  </div>
</div>

<footer id="footer"></footer>

function callMistral(sys,prompt,cb){
  var key=$("apikey").value;if(!key){showErr(t("errKey"));busy(false);return false;}
  var attempt=0,MAXTRY=5,maxTok=8192,triedLower=false;
  function go(){
    var body=JSON.stringify({model:$("model").value,messages:[{role:"system",content:sys},{role:"user",content:prompt}],temperature:0.8,max_tokens:maxTok});
    var ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
    var timer=ctrl?setTimeout(function(){try{ctrl.abort();}catch(x){}},300000):null;
    fetch("https://api.mistral.ai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:body,signal:ctrl?ctrl.signal:undefined})
    .then(function(r){
      if((r.status===400||r.status===422)&&!triedLower&&maxTok>4096){triedLower=true;maxTok=4096;setTimeout(go,500);throw new Error("LOWER");}
      if(r.status===429||r.status>=500)throw new Error("RETRY("+r.status+")");
      if(!r.ok)throw new Error("API ("+r.status+")");
      return r.json();
    })
    .then(function(d){if(timer)clearTimeout(timer);cb(d.choices&&d.choices[0]?d.choices[0].message.content:"");})
    .catch(function(e){
      if(timer)clearTimeout(timer);
      var msg=(e&&e.name==="AbortError")?"timeout":((e&&e.message)||"network");
      if(msg==="LOWER")return;
      var retryable=/^RETRY/.test(msg)||/network|failed to fetch|timeout/i.test(msg);
      if(retryable&&attempt<MAXTRY&&!(typeof stopAuto!=="undefined"&&stopAuto)){attempt++;
        if(typeof autoWriting!=="undefined"&&autoWriting&&typeof setAutoNote==="function")setAutoNote(t("autoRetry").replace("{a}",attempt));
        setTimeout(go,attempt*5000);
        return;}
      showErr(msg.replace(/^RETRY\((\d+)\)$/,"API ($1)"));
      busy(false);
      if(typeof autoWriting!=="undefined"&&autoWriting){
        autoWriting=false;updateAutoUI();
        if(typeof autoCur!=="undefined"){
          if(typeof stopAuto!=="undefined"&&stopAuto)setAutoNote(t("autoStopped").replace("{n}",autoCur).replace("{t}",typeof autoTotal!=="undefined"?autoTotal:0));
          else setAutoNote(t("autoErr").replace("{n}",autoCur+1)+" ("+msg+")");
        }
      }
    });
  }
  go();
  return true;
}

function renderPersos(){
  var p=cur(),d=$("persos");d.innerHTML="";

  p.characters.forEach(function(c,i){

    var row=document.createElement("div");row.className="row";row.style.marginBottom="6px";
    var inp=document.createElement("input");inp.style.flex="2";inp.value=c.name;
    var sel=document.createElement("select");
    ["protagoniste","antagoniste","secondaire","mentor"].forEach(function(r,j){var o=document.createElement("option");o.value=r;o.textContent=t("roles")[j];if(c.role===r)o.selected=true;sel.appendChild(o);});
    sel.style.flex="1";
    var del=document.createElement("button");del.className="ghost small";del.textContent="🗑";
    row.appendChild(inp);row.appendChild(sel);row.appendChild(del);
    var ta=document.createElement("textarea");ta.rows=3;ta.value=c.description;
    inp.oninput=function(){p.characters[i].name=this.value;save();};
    sel.onchange=function(){p.characters[i].role=this.value;save();};

}

// ============================= Génération =============================
function chlenTarget(){var w=(cur().chlen||"std");return w==="xlong"?4000:(w==="long"?2800:1700);}
function genChap(i,mode,cb){
  var p=cur(),c=p.chapters[i],pr=P();
  var opt=mode.indexOf("rw:")===0?mode.slice(3):null;
  // contexte élargi : les 3 derniers chapitres rédigés, en version longue
  var written=p.chapters.filter(function(x,j){return j!==i&&x.text;});
  var last3=written.slice(-3).map(function(x){return "« "+x.title+" » : "+x.text.slice(0,1500)+"…";}).join("\n\n");
  var ask;
  if(mode==="full")ask=pr.full(c)+" "+pr.notes(c.notes);
  else if(mode==="suite")ask=pr.suite+" "+pr.notes(c.notes);
  else ask=pr.rw[opt]+" "+pr.notes(c.notes);
  // poursuite automatique si le chapitre est plus court que la longueur demandée
  var cont=0,MAXCONT=3,auto=(mode==="full"&&!opt);
  busy(true);
  function finish(){
    c.status="redige";save();renderChaps();updateStats();
    if(cb)cb();else busy(false);
  }
  function contAsk(){
    var need=Math.max(500,chlenTarget()-wordCount(c));
    var fr=cur().nlang!=="en";
    return (fr?"Poursuis ce chapitre avec environ "+need+" mots supplémentaires, dans le même style dense et vivant, sans répéter ce qui est déjà écrit.":"Continue this chapter with about "+need+" more words, same dense style, without repeating what is already written.")+" "+pr.notes(c.notes);
  }
  function run(askTxt,isCont){
    callMistral(pr.author,
      context()+"\n\n"+pr.ctx.done+"\n"+(last3||pr.ctx.none)+"\n\n"+pr.ctx.curc+"\n"+(isCont?c.text.slice(-4000):(c.text||pr.ctx.notw))+"\n\n"+askTxt,
      function(txt){
        if(mode==="full"||opt){c.text=isCont?c.text+"\n\n"+txt:txt;}
        else c.text=c.text+"\n\n"+txt;
        if(auto&&cont<MAXCONT&&wordCount(c)<Math.round(chlenTarget()*0.8)){
          cont++;run(contAsk(),true);return;}
        finish();
      });
  }
  run(ask,false);
}

// ---- Écriture automatique de tout le roman ----
var autoWriting=false,stopAuto=false,autoCur=0,autoTotal=0;
// Empêcher la mise en veille de l'écran pendant l'écriture automatique
var wakeLock=null,wakeOk=true,wakeFailShown=false;
function wakeFail(){if(!wakeFailShown){wakeFailShown=true;showErr(t("wakeFail"));}}
function acquireWakeLock(){
  if(typeof navigator==="undefined"||!(navigator.wakeLock&&navigator.wakeLock.request)){wakeOk=false;wakeFail();return;}
  try{
    navigator.wakeLock.request("screen").then(function(wl){
      wakeLock=wl;
      wl.addEventListener("release",function(){wakeLock=null;});
    }).catch(function(){wakeOk=false;wakeFail();});
  }catch(e){wakeOk=false;wakeFail();}
}
function releaseWakeLock(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&autoWriting){wakeOk=true;acquireWakeLock();}
});
function updateAutoUI(){
  var b=$("b-autonovel"),s=$("b-stop"),n=$("auto-note"),rb=$("b-batch-rw");
  if(!b)return;
  b.disabled=autoWriting;
  if(rb)rb.disabled=autoWriting;
  s.style.display=autoWriting?"":"none";
  s.disabled=false;
  if(!autoWriting){n.style.display="none";releaseWakeLock();}
}
function setAutoNote(txt){var n=$("auto-note");n.textContent=txt;n.style.display="";}
function writeAllNovel(){
  var p=cur();
  if(!p.chapters.length){showErr(t("noChap"));return;}
  if(autoWriting)return;
  var last=-1;p.chapters.forEach(function(c,i){if(c.text)last=i;});
  var start=last+1,todo=[];
  for(var i=start;i<p.chapters.length;i++)if(!p.chapters[i].text)todo.push(i);
  if(!todo.length){showErr(t("allDone"));return;}
  autoWriting=true;stopAuto=false;autoTotal=todo.length;updateAutoUI();busy(true);
  wakeOk=true;wakeFailShown=false;acquireWakeLock();
  var done=0;
  (function next(){
    if(cur()!==p)stopAuto=true;
    if(stopAuto||done>=todo.length){
      busy(false);autoWriting=false;updateAutoUI();updateStats();
      if(stopAuto)setAutoNote(t("autoStopped").replace("{n}",done).replace("{t}",todo.length));
      return;
    }
    var i=todo[done];
    autoCur=i;
    setAutoNote(t("autoProg").replace("{n}",done+1).replace("{t}",todo.length).replace("{c}",p.chapters[i].title));
    setTimeout(function(){genChap(i,"full",function(){done++;next();});},1500);
  })();
}

// ---- Réécriture multiple (par chapitre ou tout le roman) ----
function batchRewrite(){
  var p=cur();
  if(!p)return;
  if(!p.chapters.length){showErr(t("noChap"));return;}
  if(autoWriting)return;
  var sel=rwSelList(p);
  if(!sel.length){showErr(t("rwPick"));return;}
  var modeSel=$("rwmode").value;
  var sig=p.id+"|"+modeSel+"|"+sel.join(",");
  var todo;
  if(rwQueue&&rwQueue.sig===sig&&rwQueue.list.length){todo=rwQueue.list;}
  else{todo=sel.map(function(i){var c=p.chapters[i];return {i:i,mode:(modeSel==="full"||!c.text)?"full":("rw:"+modeSel)};});}
  autoWriting=true;stopAuto=false;autoTotal=todo.length;updateAutoUI();busy(true);
  wakeOk=true;wakeFailShown=false;acquireWakeLock();
  var done=0;
  (function next(){
    var finished=done>=todo.length;
    if(!finished&&cur()!==p){stopAuto=true;}
    if(finished||stopAuto){
      rwQueue=finished?null:{sig:sig,list:todo.slice(done)};
      busy(false);autoWriting=false;updateAutoUI();updateStats();
      if(finished){setAutoNote(t("rwDone").replace("{n}",done));
        setTimeout(function(){if(!autoWriting){var nn=$("auto-note");if(nn)nn.style.display="none";}},20000);}
      else setAutoNote(t("rwStopped").replace("{n}",done).replace("{t}",todo.length));
      return;
    }
    var it=todo[done];
    if(!p.chapters[it.i]){done++;next();return;}
    autoCur=it.i;
    rwQueue={sig:sig,list:todo.slice(done)};
    setAutoNote(t("rwProg").replace("{n}",done+1).replace("{t}",todo.length).replace("{c}",p.chapters[it.i].title));
    setTimeout(function(){genChap(it.i,it.mode,function(){done++;next();});},1500);
  })();
}

function genPerso(cb){var p=cur(),pr=P();
  callMistral(pr.pro,context()+"\n\n"+P().pers,
    function(txt){try{var mm=txt.match(/\{[\s\S]*\}/);var d=JSON.parse(mm?mm[0]:txt);
      (d.characters||[]).forEach(function(c){p.characters.push({name:c.name||"",role:c.role||"secondaire",description:c.description||""});});
      save();renderPersos();cb&&cb(true);}catch(e){showErr(t("errJson"));busy(false);cb&&cb(false);}});}
function genMonde(cb){var p=cur(),pr=P();
  callMistral(pr.pro,context()+"\n\n"+P().world,
    function(txt){p.world=txt;$("world").value=txt;save();cb&&cb(true);});}
function genPlan(cb){var p=cur(),n=Math.max(3,Math.min(100,parseInt($("nch").value)||12));
  callMistral(P().pro,context()+"\n\n"+P().plan.replace("N",""+n),
    function(txt){p.plan=txt;$("plan").value=txt;
      var chs=[],re=/Chapitre\s*(\d+)\s*[:：]\s*(.+)/g,m;
      while((m=re.exec(txt))!==null){
        var rest=m[2].trim(),parts=rest.split(/\s+[—–-]\s+/),title=parts[0].trim(),summary=parts.length>1?rest.slice(title.length).replace(/^\s*[—–-]\s*/,"").trim():"";
        chs.push({title:title,summary:summary,notes:"",text:"",status:"planifie"});}
      if(chs.length)p.chapters=chs;
      save();renderChaps();updateStats();cb&&cb(true);});}
function genPitches(cb){var p=cur(),pr=P();
  callMistral(pr.pro,P().pitches.replace("GENRE",label(GENRES,p.genre)).replace("TITRE",p.title||"?"),
    function(txt){try{var mm=txt.match(/\{[\s\S]*\}/);var d=JSON.parse(mm?mm[0]:txt);
      var arr=(d.pitches||[]).filter(function(x){return typeof x==="string"&&x.trim();});
      p.pitchOptions=arr.slice(0,3);save();renderPitchOptions();cb&&cb(true);}
    catch(e){showErr(t("errJson"));busy(false);cb&&cb(false);}});}

function choosePitch(i){
  var p=cur();p.pitch=(p.pitchOptions||[])[i]||"";p.pitchOptions=[];save();
  renderAll();autoGenerate();

function autoGenerate(){
  var st=$("autoStatus");st.style.display="inline-block";busy(true);
  var steps=[{label:t("auto1"),run:genPerso},{label:t("auto2"),run:genMonde},{label:t("auto3"),run:genPlan}];
  var idx=0;
  function next(){
    if(idx>=steps.length){st.textContent=t("autoDone");busy(false);
      var tab=document.querySelector('.tab[data-t="redac"]');if(tab)tab.click();
      setTimeout(function(){st.style.display="none";},10000);return;}
    st.textContent=steps[idx].label;
    steps[idx].run(function(ok){if(!ok){st.style.display="none";return;}idx++;next();});
  }
  next();
}

function crc32(bytes){var table=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);table[n]=c>>>0;}
  var crc=0xFFFFFFFF;for(var i=0;i<bytes.length;i++)crc=table[(crc^bytes[i])&0xFF]^(crc>>>8);return (crc^0xFFFFFFFF)>>>0;}
function strBytes(s){var b=encodeURIComponent(s).replace(/%([0-9A-F]{2})/g,function(_,h){return String.fromCharCode(parseInt(h,16));});
  var out=new Uint8Array(b.length);for(var i=0;i<b.length;i++)out[i]=b.charCodeAt(i);return out;}
function u32(arr,v){arr.push(v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255);}
function u16(arr,v){arr.push(v&255,(v>>>8)&255);}
function makeZip(files){
  var parts=[],central=[],offset=0,count=files.length;
  files.forEach(function(f){
    var crc=crc32(f.data),nameB=strBytes(f.name),hdr=[];
    u32(hdr,0x04034b50);u16(hdr,20);u16(hdr,0);u16(hdr,0);u16(hdr,0);u16(hdr,0x21);
    u32(hdr,crc);u32(hdr,f.data.length);u32(hdr,f.data.length);u16(hdr,nameB.length);u16(hdr,0);
    var h8=new Uint8Array(hdr);
    parts.push(h8,nameB,f.data);
    var cd=[];u32(cd,0x02014b50);u16(cd,20);u16(cd,20);u16(cd,0);u16(cd,0);u16(cd,0);u16(cd,0x21);
    u32(cd,crc);u32(cd,f.data.length);u32(cd,f.data.length);u16(cd,nameB.length);u16(cd,0);u16(cd,0);
    u16(cd,0);u16(cd,0);u32(cd,0);u32(cd,offset);
    central.push(new Uint8Array(cd),nameB);
    offset+=h8.length+nameB.length+f.data.length;});
  var cdSize=0;central.forEach(function(p){cdSize+=p.length;});
  var eocd=[];u32(eocd,0x06054b50);u16(eocd,0);u16(eocd,0);u16(eocd,count);u16(eocd,count);u32(eocd,cdSize);u32(eocd,offset);u16(eocd,0);
  return new Blob(parts.concat(central,[new Uint8Array(eocd)]),{type:"application/epub+zip"});}

// ---- Impression / PDF ----
$("b-print").onclick=function(){
  var p=cur(),chs=chaptersWithText();
  if(!chs.length){showErr(t("noEpub"));return;}
  var html='<!doctype html><html><head><meta charset="UTF-8"><title>'+esc(p.title)+'</title><style>body{font-family:Georgia,"Times New Roman",serif;max-width:16.5cm;margin:2cm auto;color:#111;line-height:1.7}h1{text-align:center;font-size:1.9em;margin:.5em 0 1.5em}h2{page-break-before:always;margin-top:1.4em}p{margin:0 0 .35em;text-indent:1.5em}p.first{text-indent:0}@media print{body{margin:0}}</style></head><body><h1>'+esc(p.title)+'</h1>';
  chs.forEach(function(c){
    html+='<h2>'+esc(c.title)+'</h2>'+c.text.split(/\n\s*\n/).map(function(pp,i){return '<p'+(i?'':' class="first"')+'>'+esc(pp.trim()).replace(/\n/g,'<br/>')+'</p>';}).join("");
  });
  html+='</body></html>';
  var w=(typeof window!=="undefined")?window.open("","_blank"):null;
  if(!w){showErr(t("errPrint"));return;}
  w.document.write(html);w.document.close();w.focus();
  setTimeout(function(){try{w.print();}catch(e){}},400);
};

// ============================= Init =============================
renderAll();
</script>
</body>
</html>
