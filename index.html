<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier Roman IA</title>
<style>
:root{--bg:#faf9f7;--panel:#fff;--text:#292524;--muted:#78716c;--border:#e7e5e4;--accent:#b45309;--accenth:#92400e;--barbg:#fffbeb;--barborder:#fde68a;--inputbg:#fff;--soft:#f5f5f4}
body.dark{--bg:#1c1917;--panel:#292524;--text:#f5f5f4;--muted:#a8a29e;--border:#44403c;--accent:#d97706;--accenth:#f59e0b;--barbg:#292524;--barborder:#57534e;--inputbg:#1c1917;--soft:#3f3a36}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);max-width:1000px;margin:0 auto;padding:24px;min-height:100vh}
h1{color:var(--accent);font-size:1.9rem;margin-bottom:4px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:20px;font-family:system-ui,sans-serif}
h2{font-size:1.3rem;color:var(--accent);border-bottom:2px solid var(--border);padding-bottom:8px;margin-bottom:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--barbg);border:1px solid var(--barborder);border-radius:10px;padding:12px;margin-bottom:14px;font-family:system-ui,sans-serif;font-size:.85rem}
input,select,textarea,button{font-family:system-ui,sans-serif;font-size:.9rem;border-radius:8px;border:1px solid var(--border);padding:8px 10px;background:var(--inputbg);color:var(--text)}
input[type=password]{flex:1;min-width:200px}
textarea{width:100%;line-height:1.6;font-family:Georgia,serif}
label{font-family:system-ui,sans-serif;font-size:.85rem;font-weight:600;display:block;margin:10px 0 4px;color:var(--muted)}
button{cursor:pointer;background:var(--accent);color:#fff;border:none;font-weight:600;padding:8px 14px}
button:hover{background:var(--accenth)}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
button.small{padding:5px 10px;font-size:.8rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;font-family:system-ui,sans-serif}
.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{display:none;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.panel.active{display:block}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:200px}
.err{background:#7f1d1d10;border:1px solid #b91c1c55;color:#dc2626;padding:10px;border-radius:8px;margin-bottom:12px;font-family:system-ui,sans-serif;font-size:.85rem;display:none}
body.dark .err{color:#fca5a5}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.72rem;font-family:system-ui,sans-serif;background:var(--soft);color:var(--muted);margin-left:8px}
.badge.ok{background:#15803d;color:#fff}
.chap{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.chap h3{font-size:1.05rem;margin-bottom:8px}
.chap .sum{color:var(--muted);font-style:italic;font-size:.85rem;margin-bottom:8px}
.wc{font-family:system-ui,sans-serif;font-size:.75rem;color:var(--muted);font-weight:400}
.perso{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.spin{opacity:.6;pointer-events:none}
.hint{font-size:.78rem;color:var(--muted);font-family:system-ui,sans-serif;margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.topbtns{display:flex;gap:6px}
.pbar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;flex:1;min-width:120px}
.pfill{height:100%;background:var(--accent)}
.statsrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted)}
.hero{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:48px 32px;text-align:center;margin-top:24px}
.hero h2{border:none;font-size:2rem;margin-bottom:10px;padding:0}
.hero p{color:var(--muted);max-width:560px;margin:0 auto 24px;font-size:1.02rem}
.feats{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:28px;font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted)}
.hero .start{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:640px;margin:0 auto}
.hero input{min-width:200px}
.hero .big{font-size:1rem;padding:12px 24px}
.langbtn{background:transparent;color:var(--muted);border:1px solid var(--border);padding:4px 10px;font-size:.8rem}
.langbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
select.wide{width:100%}
</style>
</head>
<body>
<div class="top">
  <div><h1>📖 Atelier Roman IA</h1><p class="sub" id="t-tagline"></p></div>
  <div class="topbtns">
    <button class="langbtn" id="btn-fr">FR</button>
    <button class="langbtn" id="btn-en">EN</button>
    <button class="langbtn" id="btn-theme">🌙</button>
  </div>
</div>

<!-- Écran d'accueil -->
<div class="hero" id="hero" style="display:none">
  <h2 id="t-heroTitle"></h2>
  <p id="t-heroDesc"></p>
  <div class="feats" id="hero-feats"></div>
  <div class="start">
    <input id="hero-title" placeholder="">
    <select id="hero-genre"></select>
    <button class="big" id="hero-start"></button>
  </div>
  <div style="margin-top:16px"><button class="ghost" id="hero-load"></button>
  <input type="file" id="importFile" accept=".json" style="display:none"></div>
  <p class="hint" id="t-heroHint" style="margin-top:24px"></p>
</div>

<!-- Espace de travail -->
<div id="work" style="display:none">
  <div class="bar" id="projbar">
    <strong id="t-projects"></strong>
    <select id="projSel" style="min-width:160px"></select>
    <button class="ghost small" id="b-new"></button>
    <button class="ghost small" id="b-saveproj"></button>
    <button class="ghost small" id="b-import"></button>
    <button class="ghost small" id="b-delproj"></button>
  </div>
  <div class="bar">
    <strong>🔑 <span id="t-settings"></span></strong>
    <input type="password" id="apikey" placeholder="">
    <select id="model">
      <option value="mistral-large-latest">mistral-large-latest</option>
      <option value="mistral-medium-latest">mistral-medium-latest</option>
      <option value="mistral-small-latest">mistral-small-latest</option>
      <option value="open-mistral-nemo">open-mistral-nemo</option>
    </select>
    <span class="badge" id="keybadge"></span>
  </div>
  <div class="err" id="err"></div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-t="projet" id="t-tab1"></div>
    <div class="tab" data-t="plan" id="t-tab2"></div>
    <div class="tab" data-t="perso" id="t-tab3"></div>
    <div class="tab" data-t="monde" id="t-tab4"></div>
    <div class="tab" data-t="redac" id="t-tab5"></div>
  </div>

  <div class="panel active" id="p-projet">
    <h2 id="t-hProjet"></h2>
    <label id="t-lTitle"></label><input id="title" style="width:100%">
    <div class="row">
      <div><label id="t-lGenre"></label><select id="genre" class="wide"></select></div>
      <div><label id="t-lStyle"></label><select id="style" class="wide"></select></div>
      <div><label id="t-lNlang"></label><select id="nlang"></select></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <label style="margin:0" id="t-lPitch"></label>
      <button id="b-pitch"></button>
    </div>
    <textarea id="pitch" rows="5" style="margin-top:4px"></textarea>
  </div>

  <div class="panel" id="p-plan">
    <h2 id="t-hPlan"></h2>
    <div class="row" style="align-items:center">
      <div style="flex:0 0 auto"><label style="margin:0" id="t-lNCh"></label></div>
      <div style="flex:0 0 80px"><input type="number" id="nch" value="12" min="3" max="40"></div>
      <div style="flex:0 0 auto"><button id="b-plan"></button></div>
    </div>
    <textarea id="plan" rows="16" style="margin-top:10px"></textarea>
    <p class="hint" id="t-planHint"></p>
  </div>

  <div class="panel" id="p-perso">
    <h2 id="t-hPerso"></h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <button id="b-perso"></button>
      <button class="ghost" id="b-perso-add"></button>
    </div>
    <div id="persos"></div>
  </div>

  <div class="panel" id="p-monde">
    <h2 id="t-hMonde"></h2>
    <button id="b-monde"></button>
    <textarea id="world" rows="14" style="margin-top:10px"></textarea>
  </div>

  <div class="panel" id="p-redac">
    <h2 id="t-hRedac"></h2>
    <div class="statsrow" style="margin-bottom:12px">
      <span id="stats"></span>
      <label style="margin:0" id="t-lGoal"></label>
      <input type="number" id="goal" style="width:100px" min="1000" step="1000">
      <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
      <span id="pct"></span>
    </div>
    <div class="statsrow" style="margin-bottom:14px">
      <strong id="t-exports"></strong>
      <button class="ghost small" id="b-export">.txt</button>
      <button class="ghost small" id="b-export-md">.md</button>
      <button class="ghost small" id="b-export-epub">.epub</button>
    </div>
    <div id="chaps"></div>
  </div>
</div>

<script>
// ============================= i18n =============================
var T={
 fr:{tagline:"Créez votre roman avec l'IA : pitch, plan, personnages, univers et rédaction chapitre par chapitre. Tout est sauvegardé dans votre navigateur.",
 settings:"Connexion IA",keyPh:"Clé API Mistral (console.mistral.ai)",keyNeeded:"Clé requise",connected:"Connecté",
 tab1:"① Projet",tab2:"② Plan",tab3:"③ Personnages",tab4:"④ Univers",tab5:"⑤ Rédaction",

 hMonde:"Univers & cadre",bMonde:"✨ Générer l'univers",

 words:"mots",written:"écrits",
 bWrite:"✨ Écrire le chapitre",bRegen:"↻ Réécrire entièrement",bCont:"✍️ Continuer mon texte",bRewrite:"↻ Réécrire",
 selRewrite:"Option de réécriture…",rwDarker:"Plus sombre",rwDialog:"Plus dialogué",rwShort:"Plus court",rwDescr:"Plus descriptif",rwTense:"Plus de tension",
 bReviewed:"✓ Révisé",bUnreview:"Dé-réviser",notesPh:"Instructions pour l'IA (optionnel) : ex. « ajoute plus de dialogues », « termine par un cliffhanger »…",
 projects:"Projets :",bNew:"+ Nouveau",bSaveproj:"💾 Sauvegarder",bImport:"📂 Importer",bDelete:"🗑 Supprimer",
 deleteConfirm:"Supprimer définitivement ce roman ?",errKey:"Ajoutez votre clé API Mistral en haut de page.",
 noEpub:"Écrivez au moins un chapitre avant d'exporter.",errJson:"Fichier illisible : ce n'est pas une sauvegarde Atelier Roman IA.",
 heroTitle:"Votre roman, écrit avec l'IA",heroDesc:"Définissez une idée, l'IA propose le pitch, le plan, les personnages, l'univers, puis rédige les chapitres. Vous gardez la main à chaque étape.",
 feat1:"📚 Structure en 3 actes",feat2:"🧑‍🎤 Personnages cohérents",feat3:"✍️ Co-écriture",feat4:"📤 Export .txt, .md et .epub",
 heroStart:"📖 Commencer mon roman",heroLoad:"📂 Importer une sauvegarde",heroTitlePh:"Le titre de votre roman…",
 heroHint:"Gratuit. Chaque visiteur utilise sa propre clé API Mistral (console.mistral.ai). Vos textes restent dans votre navigateur."},
 en:{tagline:"Create your novel with AI: pitch, outline, characters, worldbuilding, and chapter-by-chapter writing. Everything is saved in your browser.",
 settings:"AI connection",keyPh:"Mistral API key (console.mistral.ai)",keyNeeded:"Key required",connected:"Connected",

 bWrite:"✨ Write the chapter",bRegen:"↻ Rewrite entirely",bCont:"✍️ Continue my text",bRewrite:"↻ Rewrite",
 selRewrite:"Rewrite option…",rwDarker:"Darker",rwDialog:"More dialogue",rwShort:"Shorter",rwDescr:"More descriptive",rwTense:"More tension",
 bReviewed:"✓ Reviewed",bUnreview:"Un-review",notesPh:"Instructions for the AI (optional): e.g. “add more dialogue”, “end on a cliffhanger”…",
 projects:"Projects:",bNew:"+ New",bSaveproj:"💾 Save",bImport:"📂 Import",bDelete:"🗑 Delete",
 deleteConfirm:"Permanently delete this novel?",errKey:"Add your Mistral API key at the top of the page.",
 noEpub:"Write at least one chapter before exporting.",errJson:"Unreadable file: not an Atelier Roman IA backup.",
 heroTitle:"Your novel, written with AI",heroDesc:"Start from an idea; the AI drafts the pitch, outline, characters and world, then writes the chapters. You stay in control at every step.",
 feat1:"📚 3-act structure",feat2:"🧑‍🎤 Consistent characters",feat3:"✍️ Co-writing",feat4:"📤 Export .txt, .md and .epub",
 heroStart:"📖 Start my novel",heroLoad:"📂 Import a backup",heroTitlePh:"The title of your novel…",
 heroHint:"Free. Each visitor uses their own Mistral API key (console.mistral.ai). Your texts stay in your browser."}
};
var L=localStorage.getItem("aria-lang")||"fr";
function t(k){return (T[L]&&T[L][k])||T.fr[k];}

var GENRES=[{v:"fantasy",fr:"Fantasy",en:"Fantasy"},{v:"scifi",fr:"Science-fiction",en:"Science fiction"},{v:"polar",fr:"Policier",en:"Detective"},{v:"thriller",fr:"Thriller",en:"Thriller"},{v:"romance",fr:"Romance",en:"Romance"},{v:"historique",fr:"Historique",en:"Historical"},{v:"horreur",fr:"Horreur",en:"Horror"},{v:"aventure",fr:"Aventure",en:"Adventure"},{v:"contemporain",fr:"Contemporain",en:"Contemporary"},{v:"medieval",fr:"Médiéval",en:"Medieval"}];
var STYLES=[{v:"classic",fr:"Roman classique, 3e personne",en:"Classic novel, third person"},{v:"p1",fr:"À la première personne",en:"First person"},{v:"poetique",fr:"Style littéraire poétique",en:"Poetic literary style"},{v:"ya",fr:"Style jeune adulte",en:"Young adult style"},{v:"noir",fr:"Style noir et punchy",en:"Hard-boiled and punchy"},{v:"humour",fr:"Humoristique",en:"Humorous"}];
function label(list,v){for(var i=0;i<list.length;i++){if(list[i].v===v)return list[i][L];}return list[0][L];}
function nlabel(list,v){return list[0][v]?list[0][v]:"fr";} // inutilisé

// ============================= Données =============================
var DB={current:null,projects:[]};
try{var s=localStorage.getItem("aria-db");if(s){DB=JSON.parse(s);}else{
  var old=localStorage.getItem("roman-ia");
  if(old){var o=JSON.parse(old);
    if(o&&(o.title||o.pitch||o.plan||(o.chapters&&o.chapters.length))){o.id="p"+Date.now();o.nlang=o.nlang||"fr";o.goal=o.goal||50000;DB.projects.push(o);DB.current=o.id;}}}
}catch(e){}
function save(){try{localStorage.setItem("aria-db",JSON.stringify(DB));}catch(e){}}
function cur(){for(var i=0;i<DB.projects.length;i++){if(DB.projects[i].id===DB.current)return DB.projects[i];}return null;}
function newProject(title,genre){var p={id:"p"+Date.now(),title:title||"",genre:genre||"fantasy",style:"classic",nlang:L==="en"?"en":"fr",pitch:"",plan:"",world:"",characters:[],chapters:[],goal:50000};DB.projects.push(p);DB.current=p.id;save();return p;}

function $(id){return document.getElementById(id);}
function showErr(m){var e=$("err");e.textContent=m;e.style.display="block";setTimeout(function(){e.style.display="none";},9000);}
function slug(s){return (s||"roman").toLowerCase().replace(/[^\w\-]+/g,"-").replace(/^-+|-+$/g,"")||"roman";}

// ============================= API Mistral =============================
function callMistral(sys,prompt,cb){
  var key=$("apikey").value;if(!key){showErr(t("errKey"));busy(false);return false;}
  var body=JSON.stringify({model:$("model").value,messages:[{role:"system",content:sys},{role:"user",content:prompt}],temperature:0.8});
  fetch("https://api.mistral.ai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:body})
    .then(function(r){if(!r.ok)throw new Error("API ("+r.status+")");return r.json();})
    .then(function(d){cb(d.choices&&d.choices[0]?d.choices[0].message.content:"");})
    .catch(function(e){showErr(e.message);busy(false);});
  return true;
}
function busy(on){var bs=document.querySelectorAll("#work button");for(var i=0;i<bs.length;i++){if(on)bs[i].classList.add("spin");else bs[i].classList.remove("spin");}}

// ============================= Prompts =============================
function P(){ // prompts selon la langue du roman
 var fr=cur().nlang!=="en";
 var W=fr?"Écris en français":"Write in English.";
 return {
  author:fr?"Tu es un romancier professionnel. Écris en français, prose soignée, sans commentaires.":"You are a professional novelist. Write in English, polished prose, no commentary.",
  pro:fr?"Tu es un auteur professionnel. Réponds en français.":"You are a professional author. Answer in English.",
  pitch:fr?"Propose un pitch percutant (5-6 phrases) pour un roman de GENRE intitulé \"TITRE\". Pièges, enjeux, promesse émotionnelle. Texte seul.":"Propose a compelling pitch (5-6 sentences) for a GENRE novel titled \"TITRE\". Traps, stakes, emotional promise. Text only.",
  plan:fr?"Construis le plan détaillé de ce roman en N chapitres, structure en trois actes. IMPÉRATIF : une seule ligne par chapitre, au format exact \"Chapitre N : Titre — Résumé de 3-4 phrases\".":"Build a detailed outline for this novel in N chapters, three-act structure. MANDATORY: one line per chapter, exact format \"Chapter N: Title — 3-4 sentence summary\".",
  pers:fr?"Crée 4 personnages clés pour ce roman. Réponds STRICTEMENT en JSON valide, sans texte autour : {\"characters\":[{\"name\":\"\",\"role\":\"protagoniste/antagoniste/secondaire\",\"description\":\"physique, caractère, motivation, arc en 3-4 phrases\"}]}":"Create 4 key characters for this novel. Answer STRICTLY as valid JSON, nothing around it: {\"characters\":[{\"name\":\"\",\"role\":\"protagonist/antagonist/secondary\",\"description\":\"appearance, personality, motivation, arc in 3-4 sentences\"}]}",
  world:fr?"Décris l'univers de ce roman : cadre géographique, époque, règles du monde (magie/technologie/société), atmosphère. 300 mots environ.":"Describe this novel's world: geography, era, world rules (magic/technology/society), atmosphere. About 300 words.",
  full:fr?function(c){return "Écris le chapitre complet « "+c.title+" » (1500-2000 mots). Résumé attendu : "+(c.summary||"libre")+". Termine sur un hook.";}
        :function(c){return "Write the full chapter \""+c.title+"\" (1500-2000 words). Expected summary: "+(c.summary||"free")+". End on a hook.";},
  suite:fr?"Continue ce chapitre avec 400 mots supplémentaires, dans le même style.":"Continue this chapter with 400 more words, same style.",
  notes:fr?function(n){return n?"Instructions de l'auteur : "+n+".":"";}
        :function(n){return n?"Author instructions: "+n+".":"";},
  rw:{darker:fr?"Réécris ce chapitre dans une atmosphère plus sombre et oppressante, en gardant les événements.":"Rewrite this chapter with a darker, heavier atmosphere, keeping the events.",
      dialog:fr?"Réécris ce chapitre avec beaucoup plus de dialogues vifs et percutants, en gardant les événements.":"Rewrite this chapter with much more lively, punchy dialogue, keeping the events.",
      short:fr?"Condense ce chapitre d'un tiers : rythme vif, supprime le superflu, garde les événements clés.":"Cut this chapter by a third: brisk pace, trim the fat, keep the key events.",
      descr:fr?"Enrichis ce chapitre de descriptions sensorielles et d'atmosphère, en gardant les événements.":"Enrich this chapter with sensory descriptions and atmosphere, keeping the events.",
      tense:fr?"Réécris ce chapitre en montant fortement la tension dramatique, en gardant les événements.":"Rewrite this chapter, dramatically raising the tension, keeping the events."},
  ctx:fr?{t:"Titre",g:"Genre",s:"Style",p:"Pitch",c:"Personnages",w:"Univers",done:"Rappel des chapitres déjà écrits :",none:"(aucun)",curc:"Chapitre actuel :",notw:"(pas encore écrit)",noC:"(aucun)"}
       :{t:"Title",g:"Genre",s:"Style",p:"Pitch",c:"Characters",w:"World",done:"Reminder of chapters already written:",none:"(none)",curc:"Current chapter:",notw:"(not written yet)",noC:"(none)"}
 };}
function context(){
 var p=cur(),x=P().ctx;
 var c=p.characters.map(function(ch){return ch.name+" ("+label([{v:"protagoniste",fr:"protagoniste",en:"protagonist"},{v:"antagoniste",fr:"antagoniste",en:"antagonist"},{v:"secondaire",fr:"secondaire",en:"secondary"},{v:"mentor",fr:"mentor",en:"mentor"}],ch.role)+") : "+ch.description;}).join("\n");

function renderPersos(){

  p.characters.forEach(function(c,i){

    var sel=document.createElement("select");

    sel.style.flex="1";

    row.appendChild(inp);row.appendChild(sel);row.appendChild(del);
    var ta=document.createElement("textarea");ta.rows=3;ta.value=c.description;
    inp.oninput=function(){p.characters[i].name=this.value;save();};

// ---------------- Chapitres ----------------
function wordCount(c){return c.text?c.text.split(/\s+/).filter(Boolean).length:0;}
function totalWords(){var p=cur();return p.chapters.reduce(function(n,c){return n+wordCount(c);},0);}
function updateStats(){
  var p=cur(),tot=totalWords(),goal=Math.max(1,parseInt($("goal").value)||50000);
  $("stats").textContent=p.chapters.length+" chap. · "+tot.toLocaleString()+" "+t("words")+" "+t("written");
  var pct=Math.min(100,Math.round(tot/goal*100));
  $("pfill").style.width=pct+"%";$("pct").textContent=pct+"%";
}
function renderChaps(){
  var p=cur(),d=$("chaps");d.innerHTML="";
  if(!p.chapters.length){d.innerHTML="<p class=\"hint\">"+t("noChap")+"</p>";return;}
  p.chapters.forEach(function(c,i){
    var w=document.createElement("div");w.className="chap";
    var h=document.createElement("h3");h.textContent=(i+1)+". "+c.title+" ";
    var b=document.createElement("span");b.className="badge"+(c.status==="redige"||c.status==="revu"?" ok":"");b.textContent=c.status;
    var wc=document.createElement("span");wc.className="wc";wc.textContent=" · "+wordCount(c).toLocaleString()+" "+t("words");
    h.appendChild(b);h.appendChild(wc);
    var btns=document.createElement("div");btns.style.cssText="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0";
    function mkBtn(txt,fn,ghost){var bt=document.createElement("button");bt.className=(ghost?"ghost ":"")+"small";bt.textContent=txt;bt.onclick=fn;btns.appendChild(bt);}
    mkBtn(c.text?t("bRegen"):t("bWrite"),function(){genChap(i,"full");});
    if(c.text){
      mkBtn(t("bCont"),function(){genChap(i,"suite");},true);
      var sel=document.createElement("select");sel.className="small";sel.style.cssText="max-width:180px;padding:5px";
      var o=document.createElement("option");o.value="";o.textContent=t("selRewrite");sel.appendChild(o);
      [["darker","rwDarker"],["dialog","rwDialog"],["short","rwShort"],["descr","rwDescr"],["tense","rwTense"]].forEach(function(a){var oo=document.createElement("option");oo.value=a[0];oo.textContent=t(a[1]);sel.appendChild(oo);});
      btns.appendChild(sel);
      mkBtn(t("bRewrite"),function(){var opt=sel.value;if(opt)genChap(i,"rw:"+opt);},true);
      mkBtn(c.status==="revu"?t("bUnreview"):t("bReviewed"),function(){c.status=c.status==="revu"?"redige":"revu";save();renderChaps();},true);
    }
    if(c.summary){var sum=document.createElement("p");sum.className="sum";sum.textContent=c.summary;w.appendChild(sum);}
    w.appendChild(h);w.appendChild(btns);
    var notes=document.createElement("input");notes.style.cssText="width:100%;margin-bottom:8px;font-size:.8rem";notes.placeholder=t("notesPh");notes.value=c.notes||"";
    notes.oninput=function(){c.notes=this.value;save();};
    w.appendChild(notes);
    var ta=document.createElement("textarea");ta.rows=c.text?14:2;ta.value=c.text;ta.placeholder="…";
    ta.oninput=function(){c.text=this.value;c.status=this.value?"redige":"planifie";save();updateStats();renderChapsSoon();};
    w.appendChild(ta);d.appendChild(w);
  });
}

// ============================= Génération =============================
function genChap(i,mode){
  var p=cur(),c=p.chapters[i],pr=P();
  var opt=mode.indexOf("rw:")===0?mode.slice(3):null;
  var done=p.chapters.filter(function(x,j){return j!==i&&x.text;}).map(function(x){return "« "+x.title+" » : "+x.text.slice(0,400)+"…";}).join("\n\n");
  var ask;
  if(mode==="full")ask=pr.full(c)+" "+pr.notes(c.notes);
  else if(mode==="suite")ask=pr.suite+" "+pr.notes(c.notes);
  else ask=pr.rw[opt]+" "+pr.notes(c.notes);
  busy(true);
  callMistral(pr.author,
    context()+"\n\n"+pr.ctx.done+"\n"+(done||pr.ctx.none)+"\n\n"+pr.ctx.curc+"\n"+(c.text||pr.ctx.notw)+"\n\n"+ask,
    function(txt){
      if(mode==="full"||opt)c.text=txt;else c.text=c.text+"\n\n"+txt;
      c.status="redige";save();renderChaps();updateStats();busy(false);
    });
}

// ---- EPUB ----
function crc32(bytes){var table=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);table[n]=c>>>0;}
  var crc=0xFFFFFFFF;for(var i=0;i<bytes.length;i++)crc=table[(crc^bytes[i])&0xFF]^(crc>>>8);return (crc^0xFFFFFFFF)>>>0;}
function strBytes(s){var b=encodeURIComponent(s).replace(/%([0-9A-F]{2})/g,function(_,h){return String.fromCharCode(parseInt(h,16));});
  var out=new Uint8Array(b.length);for(var i=0;i<b.length;i++)out[i]=b.charCodeAt(i);return out;}
function u32(arr,v){arr.push(v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255);}
function u16(arr,v){arr.push(v&255,(v>>>8)&255);}
function makeZip(files){ // files: [{name, data:Uint8Array}]
  var parts=[],central=[],offset=0,count=files.length;
  files.forEach(function(f){
    var crc=crc32(f.data),nameB=strBytes(f.name),hdr=[];
    u32(hdr,0x04034b50);u16(hdr,20);u16(hdr,0);u16(hdr,0);u16(hdr,0);u16(hdr,0x21);
    u32(hdr,crc);u32(hdr,f.data.length);u32(hdr,f.data.length);u16(hdr,nameB.length);u16(hdr,0);
    var h8=new Uint8Array(hdr);
    parts.push(h8,nameB,f.data);
    var cd=[];u32(cd,0x02014b50);u16(cd,20);u16(cd,20);u16(cd,0);u16(cd,0);u16(cd,0);u16(cd,0x21);
    u32(cd,crc);u32(cd,f.data.length);u32(cd,f.data.length);u16(cd,nameB.length);u16(cd,0);u16(cd,0);
    u16(cd,0);u16(cd,0);u32(cd,0);u32(cd,offset);
    central.push(new Uint8Array(cd),nameB);
    offset+=h8.length+nameB.length+f.data.length;});
  var cdSize=0;central.forEach(function(p){cdSize+=p.length;});
  var eocd=[];u32(eocd,0x06054b50);u16(eocd,0);u16(eocd,0);u16(eocd,count);u16(eocd,count);u32(eocd,cdSize);u32(eocd,offset);u16(eocd,0);
  return new Blob(parts.concat(central,[new Uint8Array(eocd)]),{type:"application/epub+zip"});}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
$("b-export-epub").onclick=function(){
  var p=cur(),chs=chaptersWithText();
  if(!chs.length){showErr(t("noEpub"));return;}
  var uuid="urn:uuid:"+Date.now().toString(16)+"-"+Math.floor(Math.random()*1e9).toString(16);
  var lang=p.nlang||"fr";
  var files=[{name:"mimetype",data:strBytes("application/epub+zip")}];
  files.push({name:"META-INF/container.xml",data:strBytes(
    '<?xml version="1.0" encoding="UTF-8"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>')});
  var manifest="",spine="",ncxNav="";
  chs.forEach(function(c,i){
    var fname="chap"+(i+1)+".xhtml";
    var paras=c.text.split(/\n\s*\n/).map(function(pp){return "<p>"+esc(pp.trim().replace(/\n/g,"<br/>"))+"</p>";}).join("\n");
    files.push({name:"OEBPS/"+fname,data:strBytes(
      '<?xml version="1.0" encoding="utf-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><title>'+esc(c.title)+'</title></head><body><h1>'+esc(c.title)+'</h1>'+paras+'</body></html>')});
    manifest+='<item id="c'+(i+1)+'" href="'+fname+'" media-type="application/xhtml+xml"/>';
    spine+='<itemref idref="c'+(i+1)+'"/>';
    ncxNav+='<navPoint id="n'+(i+1)+'" playOrder="'+(i+1)+'"><navLabel><text>'+esc(c.title)+'</text></navLabel><content src="'+fname+'"/></navPoint>';});
  files.push({name:"OEBPS/content.opf",data:strBytes(
    '<?xml version="1.0" encoding="UTF-8"?><package xmlns="http://www.idpf.org/2007/opf" version="2.0" unique-identifier="BookId"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>'+esc(p.title)+'</dc:title><dc:identifier id="BookId">'+uuid+'</dc:identifier><dc:language>'+lang+'</dc:language><dc:creator>Atelier Roman IA</dc:creator></metadata><manifest><item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>'+manifest+'</manifest><spine toc="ncx">'+spine+'</spine></package>')});
  files.push({name:"OEBPS/toc.ncx",data:strBytes(
    '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE ncx PUBLIC "-//NISO//DTD ncx 2005-1//EN" "http://www.daisy.org/z3986/2005/ncx-2005-1.dtd"><ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1"><head><meta name="dtb:uid" content="'+uuid+'"/></head><docTitle><text>'+esc(p.title)+'</text></docTitle><navMap>'+ncxNav+'</navMap></ncx>')});
  var a=document.createElement("a");a.href=URL.createObjectURL(makeZip(files));a.download=slug(p.title)+".epub";a.click();};
